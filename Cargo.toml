[package]
name = "noteflow-backend"
version = "0.1.0"
edition = "2021"
authors = ["Zaud Rehman"]

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "limit"] }

# Database
# sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "migrate"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "migrate", "ipnetwork"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# Authentication & Security
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
hkdf = "0.12"
base64 = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Validation
validator = { version = "0.18", features = ["derive"] }

# API Documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# Utilities
futures = "0.3"
once_cell = "1.19"
reqwest = { version = "0.12.28", features = ["json", "multipart"] }
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"



[dev-dependencies]
tokio-test = "0.4"
