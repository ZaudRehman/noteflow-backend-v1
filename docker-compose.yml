version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: noteflow
      POSTGRES_USER: noteflow
      POSTGRES_PASSWORD: noteflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://noteflow:noteflow_password@postgres:5432/noteflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-secret-change-in-production
      JWT_ACCESS_EXPIRATION: "3600"
      JWT_REFRESH_EXPIRATION: "2592000"
      RUST_LOG: info,noteflow_backend=debug
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      DATABASE_MAX_CONNECTIONS: "20"
      MAX_NOTE_SIZE: "102400"
      MAX_NOTES_PER_USER: "50"
      RATE_LIMIT_ANONYMOUS: "20"
      RATE_LIMIT_AUTHENTICATED: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
